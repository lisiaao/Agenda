<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telão - Igreja</title>
    <!-- Importando a fonte Montserrat do Google Fonts para um visual moderno e legível -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Zera as margens para a tela preencher o monitor todo */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Remove barras de rolagem */
            font-family: 'Montserrat', sans-serif;
        }

        /* O fundo que receberá a cor do painel */
        #tela-fundo {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative; /* Permite posicionar o sticker livremente */
            box-sizing: border-box;
            padding: 5%;
            /* Transição suave de 0.5 segundos ao mudar de cor */
            transition: background-color 0.5s ease; 
        }

        /* O texto central */
        #texto-principal {
            color: #FFFFFF;
            /* O tamanho 'vw' faz a fonte crescer ou diminuir dependendo do tamanho da TV/Projetor */
            font-size: 6vw; 
            text-align: center;
            margin: 0;
            line-height: 1.2;
            /* white-space: pre-wrap garante que as quebras de linha (Enter) do painel funcionem aqui */
            white-space: pre-wrap;
            transition: color 0.5s ease, opacity 0.5s ease;
        }

        /* O sticker (ícone) no canto da tela */
        #sticker-ativo {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 15vw; /* Tamanho proporcional à tela */
            max-width: 200px;
            height: auto;
            display: none; /* Começa escondido */
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div id="tela-fundo">
        <!-- A imagem do Sticker -->
        <img id="sticker-ativo" src="" alt="Sticker da Igreja">
        
        <!-- O Texto -->
        <div id="container-mensagem">
            <h1 id="texto-principal">Bem-vindos</h1>
        </div>
    </div>

    <script>
         <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        // Importando a função onValue, que fica "escutando" as mudanças em tempo real
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // COLE AQUI AS MESMAS CHAVES DO FIREBASE
      const firebaseConfig = {
  apiKey: "AIzaSyCs_hPOsGiJafU4cPbnlyHmgaJW6f05hfI",
  authDomain: "agenda-igreja-bbe84.firebaseapp.com",
  databaseURL: "https://agenda-igreja-bbe84-default-rtdb.firebaseio.com",
  projectId: "agenda-igreja-bbe84",
  storageBucket: "agenda-igreja-bbe84.firebasestorage.app",
  messagingSenderId: "654024894660",
  appId: "1:654024894660:web:96e668d92038b8234cc191"
};
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // A mágica acontece aqui: conectamos no nó 'telao'
        const telaoRef = ref(database, 'telao');

        // Sempre que houver qualquer alteração no painel, esta função roda automaticamente
        onValue(telaoRef, (snapshot) => {
            const dados = snapshot.val();
            
            if (dados) {
                const telaFundo = document.getElementById('tela-fundo');
                const textoPrincipal = document.getElementById('texto-principal');
                const stickerImg = document.getElementById('sticker-ativo');

                // Atualiza Cores
                telaFundo.style.backgroundColor = dados.corBackground;
                textoPrincipal.style.color = dados.corFonte;

                // Atualiza Texto
                if (dados.mostrar) {
                    textoPrincipal.innerText = dados.mensagem;
                    textoPrincipal.style.opacity = "1";
                } else {
                    textoPrincipal.style.opacity = "0";
                }

                // Atualiza Sticker
                if (dados.sticker === 'vazio') {
                    stickerImg.style.display = 'none';
                    stickerImg.src = '';
                } else {
                    stickerImg.src = dados.sticker;
                    stickerImg.style.display = 'block';
                }
            }
        });
    </script>

    </script>
</body>
</html>
